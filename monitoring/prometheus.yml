global:
  scrape_interval: 5s  # short so a few local test runs show up quickly

scrape_configs:
  # the api and worker run on the host for now, outside docker
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: worker
    static_configs:
      - targets: ["host.docker.internal:8001"]
