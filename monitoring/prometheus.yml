global:
  scrape_interval: 5s  # short so a few local test runs show up quickly

scrape_configs:
  - job_name: api
    metrics_path: /metrics/
    static_configs:
      - targets: ["api:8000"]

  # dns lookup instead of a fixed target, so every replica gets scraped
  # after `docker compose up --scale worker=N`
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 8001
        refresh_interval: 10s
